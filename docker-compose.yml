services:
  postgres:
    image: postgres:16-alpine
    container_name: devflix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: devflix
      POSTGRES_PASSWORD: devflix
      POSTGRES_DB: devflix
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U devflix -d devflix']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
